name: Deploy

# Deploys main to Cloudflare after CI passes on it, or on demand (Actions → Deploy → Run workflow).
#
# Setup (once): Settings → Environments → New environment "production" (deployment branches: main
# only), then add two environment secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. See
# README.md ("Deploy from GitHub Actions") for the token's permissions. Until both exist this
# workflow skips with a notice, so it is inert in Deploy-button copies that deploy with Workers
# Builds. Use one deploy path, not both (TDD §6.5).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; never cancel one halfway through (migrations may be running).
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    name: Deploy to Cloudflare
    # Only a CI run that passed on a push to main (not a pull request or fork), or a manual run on main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    # The secrets are exposed only to the two steps that need them, never to `npm ci` or the build.
    steps:
      - name: Check for Cloudflare credentials
        id: credentials
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            msg="Deploy skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the production environment to enable deploys."
            echo "::notice title=Deploy skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Deploy exactly the commit CI tested. Full history so the next step can compare it with main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.credentials.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # A re-run of an old CI run must not redeploy an older commit over a newer one: deploy only
      # if the tested commit is still the tip of main. A newer commit gets its own CI run and deploy.
      - name: Check the commit is still the tip of main
        id: current
        if: steps.credentials.outputs.ready == 'true'
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            msg="Deploy skipped: $(git rev-parse --short HEAD) is no longer the tip of main; the newer commit deploys on its own."
            echo "::notice title=Deploy skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.current.outputs.deploy == 'true'
        run: npm ci --legacy-peer-deps

      - name: Build
        if: steps.current.outputs.deploy == 'true'
        run: npm run build

      # preflight → ensure D1 exists → migrations → wrangler deploy (scripts/deploy-ci.mjs).
      - name: Deploy
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:ci
