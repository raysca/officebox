name: Deploy

# Deploys main to Cloudflare after CI passes on it, or on demand (Actions → Deploy → Run workflow).
#
# Setup (once): Settings → Environments → New environment "production", then add two environment
# secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. The token's permissions are listed in
# README.md ("Deploy from GitHub Actions"). Until both exist this workflow skips with a notice.
# Add required reviewers to the environment if every deploy should wait for approval.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; never cancel one halfway through (migrations may be running).
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    name: Deploy to Cloudflare
    # Only a CI run that passed on a push to main (not a pull request), or a manual run on main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Deploy skipped::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the production environment to enable deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Deploy exactly the commit CI tested, not whatever main points at now.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.credentials.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.credentials.outputs.ready == 'true'
        run: npm ci --legacy-peer-deps

      - name: Build
        if: steps.credentials.outputs.ready == 'true'
        run: npm run build

      # preflight → ensure D1 exists → migrations → wrangler deploy (scripts/deploy-ci.mjs).
      - name: Deploy
        if: steps.credentials.outputs.ready == 'true'
        run: npm run deploy:ci
